name: Project 02 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: project02-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          test -f README.md
          test -f requirements.txt
          test -f requirements-lock.txt
          test -f pytest.ini
          test -d src
          test -d tests
          test -d docs
          test -d evidence
          test -d infrastructure/terraform

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax validation
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform initialization
        working-directory: infrastructure/terraform
        run: terraform init -backend=false

      - name: Terraform validation
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Secret pattern check
        shell: bash
        run: |
          if grep -RInE "AKIA[0-9A-Z]{16}|aws_secret_access_key|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY" --exclude-dir=.git --exclude-dir=.venv --exclude='*.bin' .; then
            echo "Potential secret pattern detected."
            exit 1
          fi

      - name: CI success
        run: echo "Project 02 CI validation passed."
